<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriSense AI — Interface Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AgriSense AI — mock interface
   Two registers: farmer surface (silt/paddy) + instrument (slate)
   ============================================================ */

:root{
  /* palette — delta silt, paddy water, turmeric, indigo, brick */
  --silt:#E7E8E1;
  --silt-2:#DBDDD2;
  --paper:#F8F8F4;
  --ink:#131E1A;
  --ink-60:#4A5A54;
  --ink-40:#77857E;
  --paddy:#1E4B3C;
  --paddy-2:#2E6B55;
  --paddy-wash:#E2EBE5;
  --turmeric:#DF9E14;
  --turmeric-wash:#F7EBCE;
  --indigo:#27456F;
  --indigo-wash:#E3E8F1;
  --brick:#A8402A;
  --brick-wash:#F4E3DE;
  --slate:#0D1513;
  --slate-2:#16211E;
  --slate-3:#22302C;
  --slate-line:#2C3C37;
  --mono-dim:#6D8A80;
  --mono-lit:#9FE0C4;

  --r-s:6px; --r-m:10px; --r-l:16px;
  --shadow:0 1px 2px rgba(19,30,26,.06), 0 8px 24px -12px rgba(19,30,26,.22);

  --f-display:'Archivo',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --f-bn:'Noto Sans Bengali','IBM Plex Sans',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-body);
  background:var(--silt);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--turmeric);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
[lang="bn"],.bn{font-family:var(--f-bn)}

/* ---------- harness chrome ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:18px;
  padding:0 20px;height:56px;
  background:var(--slate);color:#E9F2ED;
  border-bottom:1px solid var(--slate-line);
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{
  font-family:var(--f-display);font-weight:800;font-size:17px;
  letter-spacing:-.02em;color:#fff;
}
.brand span{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mono-dim);
}
.topbar-spacer{flex:1}
.tgl{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mono-dim);
  border:1px solid var(--slate-line);border-radius:999px;
  padding:6px 13px;transition:.15s;
}
.tgl:hover{color:#E9F2ED;border-color:var(--mono-dim)}
.tgl[aria-pressed="true"]{background:var(--mono-lit);color:var(--slate);border-color:var(--mono-lit)}

.shell{
  display:grid;
  grid-template-columns:212px minmax(0,1fr) 400px;
  align-items:start;
  min-height:calc(100vh - 56px);
}

/* ---------- screen navigator ---------- */
.nav{
  position:sticky;top:56px;
  padding:26px 14px 40px;
  border-right:1px solid var(--silt-2);
  height:calc(100vh - 56px);overflow-y:auto;
}
.nav-h{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-40);
  padding:0 10px 12px;
}
.nav-i{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:9px 10px;border-radius:var(--r-s);margin-bottom:2px;
  transition:background .14s;
}
.nav-i:hover{background:var(--silt-2)}
.nav-i[aria-current="true"]{background:var(--paddy);color:#fff}
.nav-i[aria-current="true"] .nav-n{color:var(--mono-lit)}
.nav-i[aria-current="true"] .nav-s{color:rgba(255,255,255,.62)}
.nav-n{font-family:var(--f-mono);font-size:11px;color:var(--ink-40);padding-top:2px}
.nav-t{font-size:13.5px;font-weight:600;line-height:1.32;display:block}
.nav-s{font-size:11px;color:var(--ink-40);line-height:1.3;display:block;margin-top:1px}

/* ---------- stage ---------- */
.stage{padding:34px 32px 70px;display:flex;flex-direction:column;align-items:center;gap:26px}
.stage-head{width:100%;max-width:430px}
.eyebrow{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-40);margin-bottom:5px;
}
.stage-head h1{
  font-family:var(--f-display);font-weight:700;font-size:25px;
  letter-spacing:-.025em;line-height:1.15;
}
.stage-head p{font-size:13.5px;color:var(--ink-60);margin-top:7px;max-width:400px}

/* ---------- phone ---------- */
.phone{
  width:390px;flex:none;
  background:var(--paper);
  border:1px solid var(--silt-2);
  border-radius:26px;
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;flex-direction:column;
  height:720px;
}
.status{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 20px 3px;
  font-family:var(--f-mono);font-size:10.5px;color:var(--ink-40);
}
.appbar{
  display:flex;align-items:center;gap:10px;
  padding:6px 18px 12px;border-bottom:1px solid var(--silt-2);
}
.logo{
  width:26px;height:26px;border-radius:7px;background:var(--paddy);
  display:grid;place-items:center;color:var(--mono-lit);
  font-family:var(--f-display);font-weight:800;font-size:13px;
}
.appbar h2{font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1}
.appbar-ic{
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--ink-40);font-size:14px;
}
.appbar-ic:hover{background:var(--silt-2);color:var(--ink)}
.scroll{flex:1;overflow-y:auto;padding:14px 16px 18px;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:5px}
.scroll::-webkit-scrollbar-thumb{background:var(--silt-2);border-radius:9px}

/* ---------- farm at a glance ---------- */
.glance{
  border:1px solid var(--paddy);border-radius:var(--r-m);
  background:var(--paddy);color:#fff;
  padding:13px 14px;margin-bottom:14px;
}
.glance-top{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:9px;
}
.glance-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.gf-l{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:rgba(255,255,255,.5);
}
.gf-v{font-size:13.5px;font-weight:600;line-height:1.25}
.gf-v.empty{color:rgba(255,255,255,.34);font-weight:400}
.glance-next{
  margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.16);
  display:flex;gap:9px;align-items:flex-start;
}
.glance-next .dot{
  width:7px;height:7px;border-radius:50%;background:var(--turmeric);
  margin-top:5px;flex:none;
}
.glance-next div{font-size:12.5px;line-height:1.35;color:rgba(255,255,255,.9)}
.glance-next b{color:#fff}

/* ---------- conversation ---------- */
.msg{margin-bottom:13px;max-width:88%}
.msg.user{margin-left:auto}
.bub{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45}
.msg.user .bub{background:var(--paddy);color:#fff;border-bottom-right-radius:4px}
.msg.bot .bub{background:var(--silt);border-bottom-left-radius:4px}
.msg.bot .bub b{font-weight:600}
.who{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-40);margin-bottom:4px;
}
.msg.user .who{text-align:right}

.thinking{
  display:flex;align-items:center;gap:8px;
  font-family:var(--f-mono);font-size:11px;color:var(--ink-40);
  background:var(--silt);border-radius:999px;padding:6px 12px;
  margin-bottom:13px;width:fit-content;
}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--turmeric);animation:p 1.3s infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- chips ---------- */
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.chip-lbl{
  width:100%;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-40);margin-bottom:1px;
}
.chip{
  border:1px solid var(--paddy);color:var(--paddy);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;
  background:var(--paper);transition:.14s;
}
.chip:hover{background:var(--paddy-wash)}
.chip.soft{border-color:var(--silt-2);color:var(--ink-60);border-style:dashed}
.chip.soft:hover{background:var(--silt);border-color:var(--ink-40)}

/* ---------- composer ---------- */
.composer{
  display:flex;align-items:center;gap:9px;
  padding:11px 14px;border-top:1px solid var(--silt-2);background:var(--paper);
}
.composer .field{
  flex:1;background:var(--silt);border-radius:999px;padding:9px 15px;
  font-size:13.5px;color:var(--ink-40);
}
.cbtn{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--paddy);color:#fff;font-size:14px;flex:none;
}
.cbtn.ghost{background:var(--silt);color:var(--ink-60)}

/* ---------- cards ---------- */
.card{
  border:1px solid var(--silt-2);border-radius:var(--r-m);
  background:var(--paper);margin-bottom:12px;overflow:hidden;
}
.card-h{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 13px 9px;
}
.card-k{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-40);
}
.card-b{padding:0 13px 13px}

/* rank */
.rank{border-left:3px solid var(--silt-2);padding:12px 13px;border-bottom:1px solid var(--silt-2)}
.rank:last-child{border-bottom:0}
.rank.top{border-left-color:var(--paddy);background:var(--paddy-wash)}
.rank-top{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.rank-n{font-family:var(--f-mono);font-size:12px;color:var(--ink-40)}
.rank-name{font-family:var(--f-display);font-size:16.5px;font-weight:700;letter-spacing:-.015em;flex:1}
.rank-score{font-family:var(--f-mono);font-size:15px;font-weight:600;color:var(--paddy)}
.rank-score small{font-size:10px;color:var(--ink-40);font-weight:400}
.rank-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-60);margin-bottom:9px}
.rank-meta b{color:var(--ink);font-weight:600}

.bars{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-bottom:10px}
.bar-r{display:flex;align-items:center;gap:7px}
.bar-l{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-40);width:42px;flex:none;text-transform:uppercase}
.bar-t{flex:1;height:4px;background:var(--silt-2);border-radius:9px;overflow:hidden}
.bar-f{height:100%;background:var(--paddy-2);border-radius:9px}
.bar-v{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-60);width:26px;text-align:right;flex:none}

.actions{display:flex;gap:7px}
.btn{
  border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;
  border:1px solid var(--paddy);background:var(--paddy);color:#fff;transition:.14s;
}
.btn:hover{background:var(--paddy-2);border-color:var(--paddy-2)}
.btn.sec{background:transparent;color:var(--paddy)}
.btn.sec:hover{background:var(--paddy-wash)}
.btn.warn{background:var(--brick);border-color:var(--brick)}
.btn.warn:hover{filter:brightness(1.1)}
.btn.mute{background:transparent;border-color:var(--silt-2);color:var(--ink-60)}
.btn.mute:hover{background:var(--silt)}
.btn.full{width:100%;text-align:center;justify-content:center}

/* why disclosure */
.why{margin-top:10px;border-top:1px dashed var(--silt-2);padding-top:9px}
.why-btn{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--paddy);display:flex;align-items:center;gap:5px;
}
.why-body{display:none;margin-top:9px}
.why.open .why-body{display:block}
.why.open .why-btn .caret{transform:rotate(90deg)}
.caret{display:inline-block;transition:transform .16s;font-size:9px}
.prov{
  border-left:2px solid var(--turmeric);padding:0 0 0 10px;margin-bottom:9px;
}
.prov:last-child{margin-bottom:0}
.prov-s{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--turmeric);filter:brightness(.8);margin-bottom:2px;
}
.prov-t{font-size:12.5px;line-height:1.45;color:var(--ink-60)}
.prov-t b{color:var(--ink);font-weight:600}

/* tether — the signature */
.num{
  font-family:var(--f-mono);font-weight:600;
  border-bottom:1.5px dotted var(--turmeric);
  cursor:help;position:relative;
}
.num:hover,.num.lit{background:var(--turmeric-wash)}
.tag{
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.06em;
  color:var(--ink-40);vertical-align:super;margin-left:2px;text-transform:uppercase;
}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:8px;width:2px;background:var(--silt-2)}
.tl-i{position:relative;padding-bottom:15px}
.tl-i::before{
  content:'';position:absolute;left:-21px;top:5px;width:12px;height:12px;
  border-radius:50%;background:var(--paper);border:2px solid var(--silt-2);
}
.tl-i.done::before{background:var(--paddy);border-color:var(--paddy)}
.tl-i.now::before{background:var(--turmeric);border-color:var(--turmeric);box-shadow:0 0 0 4px var(--turmeric-wash)}
.tl-i.shift::before{border-color:var(--indigo);background:var(--indigo)}
.tl-d{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-40);letter-spacing:.03em}
.tl-t{font-size:14px;font-weight:600;line-height:1.3;margin:1px 0 2px}
.tl-x{font-size:12.5px;color:var(--ink-60);line-height:1.4}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  border-radius:4px;padding:2px 6px;margin-left:5px;vertical-align:2px;
}
.badge.rain{background:var(--indigo-wash);color:var(--indigo)}
.badge.now{background:var(--turmeric-wash);color:#8A6208}
.badge.risk{background:var(--brick-wash);color:var(--brick)}
.badge.ok{background:var(--paddy-wash);color:var(--paddy)}

/* ledger */
.ledger{width:100%;border-collapse:collapse;font-size:12.5px}
.ledger th{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-40);text-align:left;font-weight:400;padding:0 0 7px;
  border-bottom:1px solid var(--silt-2);
}
.ledger th:last-child,.ledger td:last-child{text-align:right}
.ledger td{padding:6px 0;border-bottom:1px solid var(--silt-2)}
.ledger td:first-child{color:var(--ink)}
.ledger td:nth-child(2){font-family:var(--f-mono);font-size:11.5px;color:var(--ink-40)}
.ledger td:last-child{font-family:var(--f-mono);font-weight:500}
.ledger tr.sum td{border-bottom:0;padding-top:9px;font-weight:700}
.ledger tr.sum td:last-child{font-size:14px}

.headline{background:var(--paddy);color:#fff;border-radius:var(--r-m);padding:14px;margin:12px 0}
.hl-r{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:13px}
.hl-r span{color:rgba(255,255,255,.66)}
.hl-r b{font-family:var(--f-mono);font-weight:500}
.hl-net{
  border-top:1px solid rgba(255,255,255,.18);margin-top:8px;padding-top:11px;
  display:flex;justify-content:space-between;align-items:baseline;
}
.hl-net span{font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.hl-net b{font-family:var(--f-display);font-size:27px;font-weight:800;letter-spacing:-.03em}
.hl-foot{
  display:flex;gap:14px;margin-top:9px;padding-top:9px;
  border-top:1px solid rgba(255,255,255,.14);
  font-family:var(--f-mono);font-size:11px;color:rgba(255,255,255,.8);flex-wrap:wrap;
}

/* stepper */
.stepper{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--silt);border-radius:var(--r-m);padding:10px 12px;margin-bottom:12px;
}
.stepper-l{font-family:var(--f-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-40)}
.stepper-v{font-family:var(--f-mono);font-size:15px;font-weight:600}
.stepper-v small{font-size:10.5px;color:var(--ink-40);font-weight:400}
.stepper-c{display:flex;gap:6px;align-items:center}
.sbtn{
  width:28px;height:28px;border-radius:7px;background:var(--paper);
  border:1px solid var(--silt-2);display:grid;place-items:center;font-size:15px;color:var(--paddy);
}
.sbtn:hover{background:var(--paddy);color:#fff;border-color:var(--paddy)}

/* HITL */
.hitl{border:2px solid var(--turmeric);border-radius:var(--r-m);background:var(--turmeric-wash);padding:13px;margin-bottom:12px}
.hitl-k{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:#8A6208;display:flex;align-items:center;gap:6px;margin-bottom:8px;
}
.hitl-amt{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:2px}
.hitl-to{font-size:12.5px;color:var(--ink-60);margin-bottom:10px}
.hitl-lines{background:rgba(255,255,255,.6);border-radius:7px;padding:9px 11px;margin-bottom:11px}
.hitl-line{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
.hitl-line span{color:var(--ink-60)}
.hitl-line b{font-family:var(--f-mono);font-weight:500}

.receipt{border:1px solid var(--paddy);border-radius:var(--r-m);overflow:hidden;margin-bottom:12px}
.receipt-h{background:var(--paddy);color:#fff;padding:11px 13px;display:flex;align-items:center;gap:8px}
.receipt-h b{font-family:var(--f-display);font-size:15px;font-weight:700;flex:1}
.receipt-b{padding:12px 13px;background:var(--paper)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:12.5px;border-bottom:1px dashed var(--silt-2)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-40);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.kv b{font-family:var(--f-mono);font-weight:500;text-align:right;word-break:break-all}

/* alert */
.alert{border-radius:var(--r-m);padding:12px 13px;margin-bottom:12px;display:flex;gap:10px}
.alert.rain{background:var(--indigo-wash);border-left:3px solid var(--indigo)}
.alert.risk{background:var(--brick-wash);border-left:3px solid var(--brick)}
.alert .ai{font-size:17px;line-height:1.2}
.alert h4{font-size:13.5px;font-weight:700;margin-bottom:3px}
.alert p{font-size:12.5px;color:var(--ink-60);line-height:1.45}

/* diff */
.diff{width:100%;border-collapse:collapse;font-size:12.5px}
.diff th{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-40);font-weight:400;padding:0 0 7px;text-align:right;border-bottom:1px solid var(--silt-2);
}
.diff th:first-child{text-align:left}
.diff td{padding:7px 0;border-bottom:1px solid var(--silt-2);text-align:right;font-family:var(--f-mono);font-size:12px}
.diff td:first-child{text-align:left;font-family:var(--f-body);font-size:12.5px}
.diff td.was{color:var(--ink-40);text-decoration:line-through}

  urea:    {label:'Urea', note:'220 kg/ha @ ৳27', perHa:5940, src:'FRG', kgPerHa:220},
  tsp:     {label:'TSP', note:'90 kg/ha @ ৳27', perHa:2430, src:'FRG', kgPerHa:90},
  mop:     {label:'MoP', note:'110 kg/ha @ ৳20', perHa:2200, src:'FRG', kgPerHa:110},
  gypsum:  {label:'Gypsum', note:'60 kg/ha @ ৳15', perHa:900, src:'FRG', kgPerHa:60},
  irrig:   {label:'Irrigation', note:'shallow tubewell, diesel', perHa:20000, src:'BBS'},
  labour:  {label:'Hired labour', note:'55 man-days/ha @ ৳500', perHa:27500, src:'BBS'},
  pest:    {label:'Pest management', note:'2 applications', perHa:4898, src:'BARI'},
  harvest: {label:'Harvest & threshing', note:'incl. transport', perHa:13878, src:'BBS'}
};
const BASE_YIELD = 4.95;      // t/ha, Boro HYV — BBS
const WEATHER_ADJ = 0.94;     // heat stress at grain fill — Open-Meteo derived
const PADDY_PRICE = 36;       // ৳/kg — govt procurement, USDA FAS BG2025-0010

function computeFinancials(areaHa, mult){
  mult = mult || {};
  const lines = Object.entries(RATES).map(([k,r])=>({
    key:k, label:r.label, note:r.note, src:r.src,
    total: Math.round(r.perHa * areaHa * (mult[k] ?? 1)),
    kg: r.kgPerHa ? Math.round(r.kgPerHa * areaHa * (mult[k] ?? 1)) : null
  }));
  const cost = lines.reduce((s,l)=>s+l.total,0);
  const yieldT = +(BASE_YIELD * areaHa * WEATHER_ADJ * (mult.yield ?? 1)).toFixed(2);
  const yieldKg = Math.round(yieldT*1000);
  const revenue = yieldKg * PADDY_PRICE;
  const net = revenue - cost;
  return {
    lines, cost, yieldT, yieldKg, revenue, net,
    roi: Math.round(net/cost*100),
    bcr: +(revenue/cost).toFixed(2),
    beYield: +(cost/PADDY_PRICE/1000).toFixed(2),
    bePrice: +(cost/yieldKg).toFixed(2)
  };
}

const state = {screen:'intake', area:0.49, pay:0, bn:false, showTrace:true};
const order = ['intake','crops','plan','money','basket','ret','whatif','trace','tokens'];

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '<div class="nav-h">Screens</div>' + order.map((k,i)=>{
    const s = SCREENS[k];
    return `<button class="nav-i" data-k="${k}" ${state.screen===k?'aria-current="true"':''}>
      <span class="nav-n">${String(i+1).padStart(2,'0')}</span>
      <span><span class="nav-t">${s.nav[0]}</span><span class="nav-s">${s.nav[1]}</span></span></button>`;
  }).join('');
  nav.querySelectorAll('.nav-i').forEach(b=>b.onclick=()=>{state.screen=b.dataset.k;state.pay=0;render();});
}

function renderTrace(){
  const key = SCREENS[state.screen].trace;
  const box = document.getElementById('traceBody');
  const meta = document.getElementById('traceMeta');
  if(!key){ meta.textContent='no agent activity on this screen'; box.innerHTML=''; return; }
  const t = TRACE[key];
  meta.textContent = t.meta;
  box.innerHTML = t.steps.map(s=>`
    <div class="step" data-step="${s.n}">
      <div class="step-h">
        <span class="step-n">${String(s.n).padStart(2,'0')}</span>
        <span class="step-ic">${ICON[s.t]}</span>
        <span class="step-name">${s.name}</span>
        <span class="step-ms">${s.ms}ms</span>
        <span class="step-st ${s.st==='ok'?'ok':s.st==='fb'?'fb':'er'}">${s.st==='ok'?'✓':s.st==='fb'?'⚠':'✕'}</span>
      </div>
      <div class="step-b">
        <div class="io"><span class="io-k">←</span><span class="io-v">${s.in}</span></div>
        <div class="io"><span class="io-k">→</span><span class="io-v"><em>${s.out}</em></span></div>
        <div class="src"><span>${s.src}</span>${s.raw?`<button class="raw-btn" onclick="this.closest('.step-b').querySelector('.raw').classList.toggle('open')">raw ▾</button>`:''}</div>
        ${s.raw?`<pre class="raw">${s.raw.replace(/</g,'&lt;')}</pre>`:''}
      </div>
    </div>`).join('');
}

function renderNotes(){
  const n = SCREENS[state.screen].notes || [];
  const el = document.getElementById('notesBody');
  el.parentNode.style.display = n.length ? 'block' : 'none';
  el.innerHTML = n.map(x=>`<div class="note"><h5>${x.h}</h5><p>${x.p}</p>${
    x.pills?`<div class="pill-row">${x.pills.map(p=>`<span class="pill">${p}</span>`).join('')}${x.pts?`<span class="pill pts">${x.pts}</span>`:''}</div>`:''
  }</div>`).join('');
}

function applyLang(){
  document.querySelectorAll('[data-en]').forEach(e=>{
    const v = state.bn ? e.dataset.bn : e.dataset.en;
    if(v){ e.textContent=v; e.classList.toggle('bn', state.bn); }
  });
}

function tethers(){
  document.querySelectorAll('.num[data-step]').forEach(n=>{
    const on = ()=>{ const s=document.querySelector(`.step[data-step="${n.dataset.step}"]`);
                     if(s){s.classList.add('lit'); s.scrollIntoView({block:'nearest',behavior:'smooth'});} n.classList.add('lit'); };
    const off= ()=>{ document.querySelectorAll('.step.lit').forEach(s=>s.classList.remove('lit')); n.classList.remove('lit'); };
    n.onmouseenter=on; n.onmouseleave=off; n.onfocus=on; n.onblur=off; n.tabIndex=0;
  });
}

function render(){
  const s = SCREENS[state.screen];
  document.getElementById('scrEyebrow').textContent = 'Screen ' + String(order.indexOf(state.screen)+1).padStart(2,'0');
  document.getElementById('scrTitle').textContent = s.title;
  document.getElementById('scrDesc').textContent = s.desc;

  const phone = document.getElementById('phone');
  const stage = document.querySelector('.stage');
  if(s.full){
    phone.style.display='none';
    let w = document.getElementById('fullWrap');
    if(!w){ w=document.createElement('div'); w.id='fullWrap'; w.style.width='100%'; w.style.display='flex'; w.style.justifyContent='center'; stage.insertBefore(w, document.querySelector('.notes')); }
    w.innerHTML = s.body(); w.style.display='flex';
  }else{
    phone.style.display='flex';
    const w = document.getElementById('fullWrap'); if(w) w.style.display='none';
    document.getElementById('screenBody').innerHTML = s.body();
    document.getElementById('screenBody').scrollTop = 0;
    document.getElementById('composer').style.display = ['intake','crops','ret','whatif'].includes(state.screen) ? 'flex':'none';
  }

  renderNav(); renderTrace(); renderNotes(); applyLang(); tethers();
  document.getElementById('trace').style.display = (state.showTrace && s.trace) ? 'flex':'none';
  document.querySelector('.shell').style.gridTemplateColumns =
    (state.showTrace && s.trace) ? '212px minmax(0,1fr) 400px' : '212px minmax(0,1fr)';
}

function bumpArea(d){ state.area = Math.max(0.1, Math.min(4, +(state.area+d).toFixed(2))); render(); }
function setPay(v){ state.pay = v; render(); }

document.getElementById('bnToggle').onclick = e => {
  state.bn = !state.bn; e.currentTarget.setAttribute('aria-pressed', state.bn); applyLang();
};
document.getElementById('traceToggle').onclick = e => {
  state.showTrace = !state.showTrace; e.currentTarget.setAttribute('aria-pressed', state.showTrace); render();
};
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  const i = order.indexOf(state.screen);
  if(e.key==='ArrowRight' && i<order.length-1){ state.screen=order[i+1]; state.pay=0; render(); }
  if(e.key==='ArrowLeft'  && i>0){ state.screen=order[i-1]; state.pay=0; render(); }
});

render();
</script>
</body>
</html>
