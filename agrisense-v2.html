<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AgriSense AI — Desktop Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   AgriSense AI — tokens transcribed directly from DESIGN.md
   "Overused Grotesk" is the spec'd display/body face (self-hosted in the
   real product); Hanken Grotesk stands in here as the nearest loadable
   fallback in the same stack position — swap the font file, keep the CSS.
   ========================================================================== */
:root{
  color-scheme: light dark;

  /* ---- color: transcribed verbatim from DESIGN.md frontmatter ---- */
  --canvas:            light-dark(#F7F9F4, #12160D);
  --surface:            light-dark(#FFFFFF, #1B2114);
  --surface-muted:      light-dark(#F1F5EC, #232B1A);
  --forest-accent:      light-dark(#294719, #8FB56B);
  --on-forest-accent:   #FFFFFF;
  --positive-green:     #6B8547;
  --warning-orange:     #EF8844;
  --warning-muted:      light-dark(#FFF2E8, #3A2415);
  --ink:                light-dark(#182014, #F1F5EC);
  --ink-secondary:      light-dark(#596452, #AEB8A0);
  --ink-tertiary:       light-dark(#87907F, #7A8370);
  --ink-disabled:       light-dark(#ABB2A5, #5B6350);
  --border-subtle:      light-dark(#E4E9DF, #2B3323);
  --border-strong:      light-dark(#CCD6C4, #3B4530);
  --soft-green:         light-dark(#EBF3E1, #1E2A16);
  --ai-soft-lime:       light-dark(#F7FFD2, #2E3312);
  --ai-lime:            #E0FF20;
  --ai-yellow:          #FFFF00;
  --trace-memory:       #6B8547;
  --trace-external:     light-dark(#2F7BC4, #6BADEB);
  --trace-retrieval:    light-dark(#294719, #8FB56B);
  --trace-deterministic: light-dark(#BA7517, #E0A94A);
  --trace-side-effect:  #EF8844;

  --gradient-ai:     linear-gradient(90deg, #E0FF20 0%, #FFFF00 100%);
  --gradient-stage:  linear-gradient(90deg, #6B8547 0%, #E0FF20 100%);

  /* button-primary text is spec'd as {colors.ink}, which is a light-dark
     pair. On a flat, theme-invariant lime->yellow gradient that resolves
     to near-white in dark mode — unreadable. Pinned to the light-mode
     ink value here since the gradient itself never darkens. Flagged to
     the team; see chat. */
  --on-ai-gradient:  #182014;

  /* ---- radius --- */
  --r-inner: 6px; --r-element: 8px; --r-container: 12px;

  /* ---- spacing scale (8px base; "steps" per DESIGN.md §Layout) ---- */
  --sp-1: 4px; --sp-1-5: 6px; --sp-2: 8px; --sp-3: 12px;
  --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  /* ---- type ---- */
  --f-display: '"Overused Grotesk"', 'Hanken Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif;
  --f-body:    '"Overused Grotesk"', 'Hanken Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif;
  --f-label:   '"Overused Grotesk"', 'Hanken Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif;
  --f-bn:      'Hind Siliguri', 'Hanken Grotesk', sans-serif;

  --rail-w-collapsed: 64px;
  --rail-w-expanded: 240px;
  --topbar-h: 56px;
}
html[data-theme="light"]{ color-scheme: light; }
html[data-theme="dark"]{ color-scheme: dark; }

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family: var(--f-body);
  background: var(--canvas);
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  transition: background .2s ease, color .2s ease;
}
[lang="bn"], .bn{ font-family: var(--f-bn); }
button{ font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea{ font: inherit; color: inherit; }
:focus-visible{ outline: 2px solid var(--forest-accent); outline-offset: 2px; border-radius: var(--r-inner); }
a{ color: inherit; }
.hidden{ display:none !important; }
.num{ font-variant-numeric: tabular-nums; }

/* ---- type roles ---- */
.t-display{ font-family:var(--f-display); font-weight:700; letter-spacing:-.01em; color:var(--ink); }
.t-heading{ font-family:var(--f-display); font-weight:700; letter-spacing:-.008em; color:var(--ink); }
.t-body{ font-family:var(--f-body); font-weight:400; color:var(--ink); }
.t-support{ font-family:var(--f-body); font-weight:400; color:var(--ink-secondary); font-size:12.5px; }
.t-label{
  font-family:var(--f-label); font-weight:600; font-size:11px;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-tertiary);
}

/* ==========================================================================
   Shell: topbar + rail (hover-expand / pin) + stage
   ========================================================================== */
.appshell{ min-height:100vh; display:flex; flex-direction:column; }

.topbar{
  height:var(--topbar-h); flex:none; display:flex; align-items:center; gap:var(--sp-4);
  padding:0 var(--sp-5); border-bottom:1px solid var(--border-subtle);
  background:var(--surface); position:sticky; top:0; z-index:80;
}
.brandmark{ display:flex; align-items:center; gap:var(--sp-2); flex:none; }
.brandmark .glyph{
  width:26px; height:26px; border-radius:var(--r-inner); background:var(--forest-accent);
  color:var(--on-forest-accent); display:grid; place-items:center; font-family:var(--f-display);
  font-weight:800; font-size:13px;
}
.brandmark b{ font-family:var(--f-display); font-weight:800; font-size:15.5px; letter-spacing:-.015em; }

.metanav{
  flex:1; display:flex; align-items:center; gap:4px; overflow-x:auto; scrollbar-width:none;
  padding:0 var(--sp-2);
}
.metanav::-webkit-scrollbar{ display:none; }
.metanav-hint{ font-family:var(--f-label); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-disabled); flex:none; margin-right:var(--sp-2); border-right:1px solid var(--border-subtle); padding-right:var(--sp-2); }
.mpill{
  flex:none; font-family:var(--f-label); font-size:11.5px; font-weight:600;
  padding:6px 11px; border-radius:999px; color:var(--ink-secondary); white-space:nowrap;
  transition:background .12s, color .12s;
}
.mpill:hover{ background:var(--surface-muted); color:var(--ink); }
.mpill[aria-current="true"]{ background:var(--forest-accent); color:var(--on-forest-accent); }

.util-group{ display:flex; align-items:center; gap:6px; flex:none; }
.util-btn{
  display:flex; align-items:center; gap:6px; height:32px; padding:0 10px;
  border-radius:var(--r-element); border:1px solid var(--border-subtle);
  color:var(--ink-secondary); font-family:var(--f-label); font-size:11.5px; font-weight:600;
  background:var(--surface); transition:.12s;
}
.util-btn:hover{ background:var(--surface-muted); color:var(--ink); border-color:var(--border-strong); }
.util-btn svg{ width:15px; height:15px; }
.util-btn[aria-pressed="true"]{ background:var(--soft-green); color:var(--forest-accent); border-color:var(--border-strong); }

.shellbody{ flex:1; display:flex; min-height:0; }

/* ---- rail ---- */
.rail{
  flex:none; width:var(--rail-w-collapsed); background:var(--surface);
  border-right:1px solid var(--border-subtle); display:flex; flex-direction:column;
  transition:width .16s ease; overflow:hidden; position:relative; z-index:60;
}
.rail:hover, .rail.pinned{ width:var(--rail-w-expanded); }
.rail-section{ padding:var(--sp-3) 0; border-bottom:1px solid var(--border-subtle); }
.rail-section:last-of-type{ border-bottom:0; }
.rail-farmhead{
  display:flex; align-items:center; gap:10px; padding:var(--sp-3) 14px; height:56px;
  border-bottom:1px solid var(--border-subtle); flex:none;
}
.rail-farmhead .avatar{
  width:32px; height:32px; border-radius:var(--r-inner); background:var(--soft-green);
  color:var(--forest-accent); display:grid; place-items:center; flex:none; font-weight:700; font-size:13px;
  font-family:var(--f-display);
}
.rail-farmhead .txt{ min-width:0; opacity:0; transition:opacity .12s; white-space:nowrap; }
.rail:hover .rail-farmhead .txt, .rail.pinned .rail-farmhead .txt{ opacity:1; }
.rail-farmhead .txt b{ display:block; font-size:13px; font-weight:700; }
.rail-farmhead .txt span{ display:block; font-size:11px; color:var(--ink-tertiary); }

.rail-item{
  display:flex; align-items:center; gap:14px; height:40px; padding:0 20px; width:100%;
  color:var(--ink-secondary); position:relative; white-space:nowrap;
}
.rail-item svg{ width:19px; height:19px; flex:none; }
.rail-item .lbl{ opacity:0; transition:opacity .1s; font-size:13px; font-weight:500; }
.rail:hover .rail-item .lbl, .rail.pinned .rail-item .lbl{ opacity:1; }
.rail-item:hover{ background:var(--surface-muted); color:var(--ink); }
.rail-item[aria-current="true"]{ color:var(--forest-accent); background:var(--soft-green); }
.rail-item[aria-current="true"]::before{
  content:''; position:absolute; left:0; top:6px; bottom:6px; width:3px;
  background:var(--forest-accent); border-radius:0 3px 3px 0;
}
.rail-item .stage-dot{
  width:7px; height:7px; border-radius:50%; background:var(--positive-green); flex:none;
  margin-left:-4px; opacity:0; transition:opacity .1s;
}
.rail:hover .rail-item .stage-dot, .rail.pinned .rail-item .stage-dot{ opacity:1; }
.rail-item .stage-dot.done{ background:var(--ink-disabled); }

.rail-pin{
  margin-top:auto; display:flex; align-items:center; gap:14px; height:48px; padding:0 20px;
  border-top:1px solid var(--border-subtle); color:var(--ink-tertiary);
}
.rail-pin svg{ width:17px; height:17px; flex:none; }
.rail-pin .lbl{ opacity:0; transition:opacity .1s; font-size:12px; font-family:var(--f-label); font-weight:600; letter-spacing:.04em; }
.rail:hover .rail-pin .lbl, .rail.pinned .rail-pin .lbl{ opacity:1; }
.rail-pin[aria-pressed="true"]{ color:var(--forest-accent); }
.rail-pin:hover{ background:var(--surface-muted); }

/* ---- stage ---- */
.stage{ flex:1; min-width:0; overflow-y:auto; background:var(--canvas); }
.stage-inner{ max-width:1440px; margin:0 auto; padding:var(--sp-6) var(--sp-6) var(--sp-10); }
.stage-caption{
  display:flex; align-items:baseline; gap:10px; margin-bottom:var(--sp-5); flex-wrap:wrap;
}
.stage-caption .eyebrow{ font-family:var(--f-label); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-tertiary); }
.stage-caption h1{ font-family:var(--f-display); font-size:19px; font-weight:800; letter-spacing:-.015em; }
.stage-caption p{ width:100%; font-size:13px; color:var(--ink-secondary); max-width:760px; margin-top:2px; }

/* ==========================================================================
   Components
   ========================================================================== */

/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:36px; padding:0 16px; border-radius:var(--r-element);
  font-family:var(--f-label); font-size:13px; font-weight:700; white-space:nowrap;
  transition:filter .12s, background .12s, border-color .12s;
}
.btn svg{ width:15px; height:15px; }
.btn-primary{ background:var(--gradient-ai); color:var(--on-ai-gradient); }
.btn-primary:hover{ filter:brightness(1.04); }
.btn-secondary{ background:var(--surface); color:var(--ink); border:1px solid var(--border-strong); }
.btn-secondary:hover{ background:var(--surface-muted); }
.btn-ghost{ background:transparent; color:var(--ink-secondary); }
.btn-ghost:hover{ background:var(--surface-muted); color:var(--ink); }
.btn-sm{ height:30px; padding:0 12px; font-size:12px; }
.btn-block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.icon-btn{
  width:34px; height:34px; border-radius:var(--r-element); display:grid; place-items:center;
  color:var(--ink-secondary); flex:none;
}
.icon-btn:hover{ background:var(--surface-muted); color:var(--ink); }
.icon-btn svg{ width:17px; height:17px; }

/* badges */
.badge{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--f-label);
  font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  padding:3px 9px; border-radius:var(--r-element); white-space:nowrap;
}
.badge-green{ background:var(--soft-green); color:var(--forest-accent); }
.badge-ai{ background:var(--ai-soft-lime); color:var(--ink); }
.badge-warn-soft{ background:var(--warning-muted); color:var(--warning-orange); }
.badge-warn-solid{ background:var(--warning-orange); color:#fff; }
.badge-neutral{ background:var(--surface-muted); color:var(--ink-secondary); }

/* cards / containers */
.card{
  background:var(--surface); border-radius:var(--r-container);
  border:1px solid var(--border-subtle); overflow:hidden;
}
.card.selected{ box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--positive-green) 55%, transparent); }
.card-head{ display:flex; align-items:center; gap:10px; padding:var(--sp-4) var(--sp-4) var(--sp-2); }
.card-head .t-label{ flex:1; }
.card-body{ padding:0 var(--sp-4) var(--sp-4); }
.card-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-4); }
.card-grid.tri{ grid-template-columns:repeat(3,1fr); }

/* the hero next-steps container spans the row */
.hero-card{ grid-column:1 / -1; }

/* edge-to-edge rows (never nested cards) */
.rowlist{ display:flex; flex-direction:column; }
.rowlist .row{
  display:flex; align-items:center; gap:12px; padding:11px 0;
  border-bottom:1px solid var(--border-subtle);
}
.rowlist .row:last-child{ border-bottom:0; }

/* forms */
.field-lbl{ font-family:var(--f-label); font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-tertiary); display:block; margin-bottom:5px; }
.input{
  width:100%; height:38px; padding:0 12px; border-radius:var(--r-element);
  border:1px solid var(--border-subtle); background:var(--surface); color:var(--ink); font-size:13.5px;
}
.input:focus{ border-color:var(--forest-accent); }
.chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{
  border:1px solid var(--border-strong); color:var(--ink); background:var(--surface);
  border-radius:999px; padding:7px 14px; font-size:13px; font-weight:500; transition:.12s;
}
.chip:hover{ background:var(--soft-green); border-color:var(--forest-accent); color:var(--forest-accent); }
.chip.soft{ border-style:dashed; color:var(--ink-secondary); }
.chip.rec{ border-color:var(--forest-accent); background:var(--soft-green); color:var(--forest-accent); font-weight:700; }

/* tabs */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border-subtle); margin-bottom:var(--sp-4); }
.tab{
  font-family:var(--f-label); font-size:12.5px; font-weight:700; letter-spacing:.02em;
  padding:9px 14px; color:var(--ink-tertiary); position:relative; top:1px;
  border-bottom:2px solid transparent;
}
.tab:hover:not(:disabled){ color:var(--ink); }
.tab[aria-selected="true"]{ color:var(--forest-accent); border-bottom-color:var(--forest-accent); }
.tab:disabled{ color:var(--ink-disabled); cursor:not-allowed; }

/* season / stage strip */
.stagestrip{ padding:var(--sp-4); background:var(--surface); border:1px solid var(--border-subtle); border-radius:var(--r-container); margin-bottom:var(--sp-4); }
.stagestrip-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:10px; flex-wrap:wrap; }
.stagestrip-track{ position:relative; height:6px; background:var(--border-subtle); border-radius:99px; margin:0 4px; }
.stagestrip-fill{ position:absolute; inset:0 auto 0 0; height:100%; border-radius:99px; background:var(--gradient-stage); }
.stagestrip-marks{ display:flex; justify-content:space-between; margin-top:9px; padding:0 0; }
.smark{ display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; position:relative; }
.smark .dot{ width:9px; height:9px; border-radius:50%; background:var(--surface); border:2px solid var(--border-strong); margin-top:-15px; }
.smark.done .dot{ background:var(--positive-green); border-color:var(--positive-green); }
.smark.now .dot{ width:12px; height:12px; margin-top:-16.5px; background:var(--ai-lime); border-color:var(--forest-accent); box-shadow:0 0 0 4px var(--soft-green); }
.smark .lbl{ font-size:10px; color:var(--ink-tertiary); font-family:var(--f-label); font-weight:600; text-align:center; }
.smark.now .lbl{ color:var(--forest-accent); }

/* identity strip */
.idstrip{
  display:flex; flex-wrap:wrap; gap:var(--sp-6); align-items:center; padding:var(--sp-3) var(--sp-4);
  background:var(--surface); border:1px solid var(--border-subtle); border-radius:var(--r-container);
  margin-bottom:var(--sp-4);
}
.idstrip .name{ font-family:var(--f-display); font-weight:800; font-size:16px; letter-spacing:-.01em; margin-right:auto; }
.idfact{ display:flex; align-items:center; gap:6px; }
.idfact svg{ width:14px; height:14px; color:var(--ink-tertiary); }
.idfact .v{ font-size:12.5px; font-weight:600; }
.idfact .v.empty{ color:var(--ink-disabled); font-weight:400; font-style:italic; }
.idfact .edit-hint{ opacity:0; transition:opacity .1s; color:var(--ink-tertiary); }
.idfact:hover .edit-hint{ opacity:1; }
.idfact .edit-hint svg{ width:12px; height:12px; }

/* workspace split */
.worksplit{ display:grid; grid-template-columns:minmax(400px,42%) 1fr; gap:var(--sp-4); align-items:start; }

/* chat */
.chatpanel{
  background:var(--surface); border:1px solid var(--border-subtle); border-radius:var(--r-container);
  display:flex; flex-direction:column; height:640px;
}
.chatpanel.tall{ height:760px; }
.chat-scroll{ flex:1; overflow-y:auto; padding:var(--sp-4); }
.msg{ margin-bottom:var(--sp-4); max-width:92%; }
.msg.user{ margin-left:auto; }
.msg .who{ font-family:var(--f-label); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-disabled); margin-bottom:4px; }
.msg.user .who{ text-align:right; }
.bubble{ padding:10px 13px; border-radius:var(--r-container); font-size:13.5px; line-height:1.5; }
.msg.user .bubble{ background:var(--forest-accent); color:var(--on-forest-accent); border-bottom-right-radius:4px; }
.msg.bot .bubble{ background:var(--surface-muted); border-bottom-left-radius:4px; }
.msg.bot .bubble p + p{ margin-top:8px; }
.msg.bot .bubble b{ font-weight:700; }

/* Claude-style collapsible trace summary, ABOVE the bot bubble */
.tracesum{
  display:inline-flex; align-items:center; gap:8px; padding:6px 10px; margin-bottom:6px;
  border-radius:var(--r-element); background:var(--surface-muted); cursor:pointer;
  font-family:var(--f-label); font-size:11.5px; color:var(--ink-tertiary); font-weight:600;
  transition:background .12s;
}
.tracesum:hover{ background:var(--soft-green); color:var(--forest-accent); }
.tracesum .chev{ width:12px; height:12px; transition:transform .15s; flex:none; }
.tracesum.open .chev{ transform:rotate(90deg); }
.tracesum .dots{ display:flex; gap:3px; }
.tracesum .dots i{ width:6px; height:6px; border-radius:50%; display:block; }
.traceblock{ display:none; margin:0 0 10px; border:1px solid var(--border-subtle); border-radius:var(--r-element); overflow:hidden; }
.traceblock.open{ display:block; }

.tstep{ border-bottom:1px solid var(--border-subtle); }
.tstep:last-child{ border-bottom:0; }
.tstep-h{ display:flex; align-items:center; gap:9px; padding:8px 10px; width:100%; text-align:left; background:var(--surface); }
.tstep-h:hover{ background:var(--surface-muted); }
.tclass-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
.tc-field{ background:var(--trace-memory); }
.tc-external{ background:var(--trace-external); }
.tc-retrieval{ background:var(--trace-retrieval); }
.tc-deterministic{ background:var(--trace-deterministic); }
.tc-gated{ background:var(--trace-side-effect); }
.tstep-name{ font-family:var(--f-label); font-size:11.5px; font-weight:600; flex:1; color:var(--ink); }
.tstep-name code{ font-weight:700; }
.tstep-ms{ font-size:10.5px; color:var(--ink-tertiary); font-family:var(--f-label); }
.tstep-status{ font-size:12px; width:14px; text-align:center; }
.tstep-status.ok{ color:var(--positive-green); }
.tstep-status.fb{ color:var(--warning-orange); }
.tstep-status.run{ color:var(--ink-tertiary); }
.tstep-b{ padding:0 10px 9px 27px; font-size:11.5px; background:var(--surface-muted); }
.tio{ display:flex; gap:6px; padding:2px 0; }
.tio-k{ color:var(--ink-tertiary); flex:none; width:14px; }
.tio-v{ color:var(--ink-secondary); }
.tio-v em{ color:var(--ink); font-style:normal; font-weight:600; }
.tsrc{ display:flex; justify-content:space-between; align-items:center; margin-top:5px; }
.tsrc span{ font-size:10.5px; color:var(--ink-tertiary); }
.rawtoggle{ font-family:var(--f-label); font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--forest-accent); }
.rawbox{ display:none; margin-top:6px; background:var(--canvas); border:1px solid var(--border-subtle); border-radius:var(--r-inner); padding:8px; font-size:10.5px; color:var(--ink-secondary); white-space:pre-wrap; line-height:1.6; max-height:180px; overflow:auto; }
.rawbox.open{ display:block; }
.pulse-dot{ width:6px; height:6px; border-radius:50%; background:var(--warning-orange); animation:pd 1.2s infinite; }
@keyframes pd{ 0%,100%{opacity:.3} 50%{opacity:1} }

.chip-row.in-chat{ padding:0 var(--sp-4) var(--sp-3); }
.composer{
  display:flex; align-items:center; gap:8px; padding:var(--sp-3) var(--sp-4);
  border-top:1px solid var(--border-subtle);
}
.composer .field{ flex:1; height:38px; display:flex; align-items:center; padding:0 14px; background:var(--surface-muted); border-radius:999px; font-size:13px; color:var(--ink-tertiary); }
.composer .send{ width:34px; height:34px; border-radius:50%; background:var(--forest-accent); color:var(--on-forest-accent); display:grid; place-items:center; flex:none; }
.composer .send svg{ width:15px; height:15px; }

/* right pane cards */
.rightpane{ display:flex; flex-direction:column; gap:var(--sp-4); }

/* why panel */
.whytrig{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--f-label); font-size:10.5px;
  font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--forest-accent);
  margin-top:8px; padding:4px 9px; background:var(--ai-soft-lime); border-radius:var(--r-inner);
}
.whytrig svg{ width:11px; height:11px; transition:transform .15s; }
.whytrig.open svg{ transform:rotate(90deg); }
.whybody{ display:none; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border-subtle); }
.whybody.open{ display:block; }
.prov{ display:flex; gap:8px; padding:5px 0; align-items:flex-start; }
.prov .m{ flex:none; width:16px; height:16px; border-radius:4px; display:grid; place-items:center; margin-top:1px; }
.prov .m svg{ width:10px; height:10px; color:#fff; }
.prov .tx{ font-size:12px; color:var(--ink-secondary); line-height:1.5; }
.prov .tx b{ color:var(--ink); font-weight:700; }
.prov .tx .src{ color:var(--ink-tertiary); font-size:10.5px; display:block; margin-top:1px; }

/* timeline (plan tab) */
.tl{ position:relative; padding-left:22px; }
.tl::before{ content:''; position:absolute; left:5px; top:4px; bottom:8px; width:2px; background:var(--border-subtle); }
.tl-i{ position:relative; padding-bottom:var(--sp-5); }
.tl-i::before{ content:''; width:12px; height:12px; border-radius:50%; background:var(--surface); border:2px solid var(--border-strong); position:absolute; left:-21px; top:2px; }
.tl-i.done::before{ background:var(--positive-green); border-color:var(--positive-green); }
.tl-i.now::before{ background:var(--ai-lime); border-color:var(--forest-accent); box-shadow:0 0 0 4px var(--soft-green); }
.tl-i.shift::before{ background:var(--trace-external); border-color:var(--trace-external); }
.tl-d{ font-family:var(--f-label); font-size:11px; color:var(--ink-tertiary); letter-spacing:.02em; }
.tl-t{ font-size:14px; font-weight:700; margin:2px 0 3px; }
.tl-x{ font-size:12.5px; color:var(--ink-secondary); line-height:1.5; }

/* money / ledger */
.ledger{ width:100%; border-collapse:collapse; font-size:12.5px; }
.ledger th{ font-family:var(--f-label); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-tertiary); font-weight:600; text-align:left; padding:0 0 8px; border-bottom:1px solid var(--border-subtle); }
.ledger th:last-child, .ledger td:last-child{ text-align:right; }
.ledger td{ padding:8px 0; border-bottom:1px solid var(--border-subtle); vertical-align:top; }
.ledger tr:last-child td{ border-bottom:0; }
.ledger td.item{ font-weight:600; }
.ledger td.basis{ color:var(--ink-tertiary); font-size:11.5px; }
.ledger td.amt{ font-weight:600; }
.ledger tr.sum td{ padding-top:11px; border-top:1px solid var(--border-strong); border-bottom:0; font-weight:700; }
.ledger .was{ color:var(--ink-disabled); text-decoration:line-through; font-size:11px; margin-right:5px; }
.editrow{ cursor:pointer; }
.editrow:hover{ background:var(--surface-muted); }
.editrow .pencil{ opacity:0; margin-left:5px; color:var(--ink-tertiary); }
.editrow:hover .pencil{ opacity:1; }

.headline{ background:var(--forest-accent); color:#fff; border-radius:var(--r-container); padding:var(--sp-4); }
.hl-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:rgba(255,255,255,.7); }
.hl-row b{ color:#fff; font-weight:600; }
.hl-net{ border-top:1px solid rgba(255,255,255,.2); margin-top:9px; padding-top:11px; display:flex; justify-content:space-between; align-items:baseline; }
.hl-net span{ font-family:var(--f-label); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.65); }
.hl-net b{ font-family:var(--f-display); font-size:25px; font-weight:800; }
.hl-foot{ display:flex; gap:14px; flex-wrap:wrap; margin-top:9px; padding-top:9px; border-top:1px solid rgba(255,255,255,.16); font-size:11.5px; color:rgba(255,255,255,.85); }

.stepper{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-muted); border-radius:var(--r-element); padding:10px 12px; }
.stepper .sv{ font-family:var(--f-display); font-size:15px; font-weight:700; }
.stepper .sv small{ font-weight:400; font-size:11px; color:var(--ink-tertiary); }
.stepbtns{ display:flex; gap:6px; }
.stepbtn{ width:28px; height:28px; border-radius:var(--r-inner); background:var(--surface); border:1px solid var(--border-subtle); display:grid; place-items:center; color:var(--forest-accent); font-weight:700; }
.stepbtn:hover{ background:var(--soft-green); }

.invariant{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--forest-accent); font-family:var(--f-label); font-weight:600; }
.invariant svg{ width:14px; height:14px; }

/* alerts */
.alert{ display:flex; gap:10px; padding:12px 13px; border-radius:var(--r-container); }
.alert.info{ background:var(--surface-muted); border-left:3px solid var(--trace-external); }
.alert.risk-low{ background:var(--soft-green); border-left:3px solid var(--positive-green); }
.alert.risk-mid{ background:var(--warning-muted); border-left:3px solid var(--warning-orange); }
.alert.risk-hi{ background:var(--warning-orange); border-left:3px solid var(--warning-orange); color:#fff; }
.alert .ic{ flex:none; width:18px; height:18px; }
.alert h4{ font-size:13px; font-weight:700; margin-bottom:3px; }
.alert p{ font-size:12px; line-height:1.5; opacity:.9; }
.alert.risk-hi h4, .alert.risk-hi p{ color:#fff; opacity:1; }

/* HITL / checkout */
.hitl{ border:2px solid var(--ai-lime); background:var(--ai-soft-lime); border-radius:var(--r-container); padding:var(--sp-4); }
.hitl-k{ font-family:var(--f-label); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); opacity:.7; display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.hitl-amt{ font-family:var(--f-display); font-size:25px; font-weight:800; letter-spacing:-.02em; }
.hitl-to{ font-size:12px; color:var(--ink-secondary); margin:2px 0 10px; }
.hitl-lines{ background:var(--surface); border-radius:var(--r-element); padding:9px 11px; margin-bottom:11px; }
.hitl-line{ display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }
.hitl-line span{ color:var(--ink-secondary); }

.receipt{ border:1px solid var(--border-strong); border-radius:var(--r-container); overflow:hidden; }
.receipt-h{ background:var(--forest-accent); color:#fff; padding:11px 14px; display:flex; align-items:center; gap:9px; }
.receipt-h b{ font-family:var(--f-display); font-size:14.5px; font-weight:700; flex:1; }
.receipt-b{ padding:12px 14px; background:var(--surface); }
.kv{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:12px; border-bottom:1px dashed var(--border-subtle); }
.kv:last-child{ border-bottom:0; }
.kv span{ color:var(--ink-tertiary); font-family:var(--f-label); font-size:10px; letter-spacing:.06em; text-transform:uppercase; }
.kv b{ font-weight:600; text-align:right; word-break:break-all; }

/* scenario diff */
.diff{ width:100%; border-collapse:collapse; font-size:12.5px; }
.diff th{ font-family:var(--f-label); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-tertiary); font-weight:600; padding:0 0 8px; border-bottom:1px solid var(--border-subtle); text-align:right; }
.diff th:first-child{ text-align:left; }
.diff td{ padding:8px 0; border-bottom:1px solid var(--border-subtle); text-align:right; }
.diff td:first-child{ text-align:left; font-weight:500; }
.diff .was{ color:var(--ink-disabled); text-decoration:line-through; }
.diff .now.up{ color:var(--forest-accent); font-weight:700; }
.diff .now.down{ color:var(--warning-orange); font-weight:700; }

/* tokens page */
.tok-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.swatch{ border-radius:var(--r-container); overflow:hidden; border:1px solid var(--border-subtle); }
.swatch .fill{ height:52px; }
.swatch .lbl{ padding:8px 10px; background:var(--surface); }
.swatch .lbl b{ display:block; font-size:12px; font-weight:700; }
.swatch .lbl code{ font-size:10px; color:var(--ink-tertiary); }
.typerow{ display:flex; align-items:baseline; gap:16px; padding:12px 0; border-bottom:1px solid var(--border-subtle); flex-wrap:wrap; }
.typerow .lbl{ font-family:var(--f-label); font-size:10px; color:var(--ink-tertiary); width:130px; flex:none; letter-spacing:.06em; text-transform:uppercase; }

@media (max-width:1180px){ .worksplit{ grid-template-columns:1fr; } }
</style>
</head>

<script>
/* ============================================================
   AgriSense AI — desktop mock engine
   Tokens/components follow DESIGN.md. Content follows the
   canonical numbers established across the blueprint set.
   ============================================================ */

/* ---------- formatting ---------- */
const tk = n => '৳' + Math.round(n).toLocaleString('en-IN');
const kg = n => Math.round(n) + ' kg';

/* ---------- financial engine (pure; mirrors packages/shared spec) ---------- */
const RATES = {
  landprep:{ label:'Land preparation', note:'4 passes, power tiller', perHa:11000, src:'BBS cost-of-production survey' },
  seed:    { label:'Seed — BRRI dhan89', note:'25 kg/ha @ ৳58/kg', perHa:1469, src:'BADC seed price list', kgPerHa:25 },
  urea:    { label:'Urea', note:'220 kg/ha @ ৳27/kg', perHa:5940, src:'BARC FRG-2018 p.47 · MoA 2023 price order', kgPerHa:220, unitCost:27 },
  tsp:     { label:'TSP', note:'90 kg/ha @ ৳27/kg', perHa:2430, src:'BARC FRG-2018 p.47 · MoA 2023', kgPerHa:90, unitCost:27 },
  mop:     { label:'MoP', note:'110 kg/ha @ ৳20/kg', perHa:2200, src:'BARC FRG-2018 p.47 · MoA 2023', kgPerHa:110, unitCost:20 },
  gypsum:  { label:'Gypsum', note:'60 kg/ha @ ৳15/kg', perHa:900, src:'BARC FRG-2018 p.49', kgPerHa:60, unitCost:15 },
  irrig:   { label:'Irrigation', note:'shallow tubewell, diesel', perHa:20000, src:'BBS cost-of-production survey' },
  labour:  { label:'Hired labour', note:'55 man-days/ha @ ৳500', perHa:27500, src:'BBS cost-of-production survey' },
  pest:    { label:'Pest management', note:'2 scouted applications', perHa:4898, src:'BARI advisory rate' },
  harvest: { label:'Harvest & threshing', note:'incl. transport', perHa:13869, src:'BBS cost-of-production survey' }
};
const BASE_YIELD = 4.95, WEATHER_ADJ = 0.94, PADDY_PRICE = 36;

function computeFinancials(areaHa, overrides={}){
  const lines = Object.entries(RATES).map(([key,r])=>{
    const unitCost = overrides[key+'_cost'] ?? r.unitCost;
    const mult = overrides[key+'_mult'] ?? 1;
    let total;
    if (r.kgPerHa && unitCost){
      const qty = Math.round(r.kgPerHa * areaHa * mult);
      total = qty * unitCost;
      return { key, label:r.label, basis:`${r.kgPerHa} kg/ha × ${areaHa.toFixed(2)} ha`, qty, unit:'kg', unitCost, total, src:r.src,
               overridden: unitCost !== r.unitCost };
    }
    total = Math.round(r.perHa * areaHa * mult);
    return { key, label:r.label, basis:r.note, qty:null, unit:null, unitCost:null, total, src:r.src, overridden:false };
  });
  const cost = lines.reduce((s,l)=>s+l.total,0);
  const yieldMult = overrides.yield_mult ?? 1;
  const yieldT = +(BASE_YIELD * areaHa * WEATHER_ADJ * yieldMult).toFixed(2);
  const yieldKg = Math.round(yieldT*1000);
  const revenue = yieldKg * PADDY_PRICE;
  const net = revenue - cost;
  return {
    lines, cost, yieldT, yieldKg, revenue, net,
    roi: Math.round(net/cost*100),
    bcr: +(revenue/cost).toFixed(2),
    beYield: +(cost/PADDY_PRICE/1000).toFixed(2),
    bePrice: +(cost/yieldKg).toFixed(2)
  };
}

/* ---------- shared state ---------- */
const state = {
  screen: 'login',

/* ---------- trace class → icon ---------- */
const TCLASS_ICON = { field:'i-database', external:'i-cloud', retrieval:'i-search', deterministic:'i-cpu', gated:'i-card' };
const TCLASS_LABEL = { field:'memory', external:'external', retrieval:'retrieval', deterministic:'deterministic', gated:'gated' };

function dot(cls){ return `<i class="tclass-dot tc-${cls}"></i>`; }

function tstep(s, idPrefix){
  const raw = s.raw ? `
    <div class="tsrc">
      <span>${s.src}</span>
      <button class="rawtoggle" onclick="toggleRaw(this)">raw ▾</button>
    </div>
    <div class="rawbox">${s.raw.replace(/</g,'&lt;')}</div>` :
    `<div class="tsrc"><span>${s.src}</span></div>`;
  const statusIcon = s.status==='ok' ? '✓' : s.status==='fb' ? '⚠' : '<span class="pulse-dot"></span>';
  const statusCls = s.status==='ok' ? 'ok' : s.status==='fb' ? 'fb' : 'run';
  return `
  <div class="tstep">
    <div class="tstep-h">
      ${dot(s.cls)}
      <span class="tstep-name"><code>${s.name}</code></span>
      <span class="tstep-ms">${s.ms!=null? s.ms+'ms':''}</span>
      <span class="tstep-status ${statusCls}">${statusIcon}</span>
    </div>
    <div class="tstep-b">
      <div class="tio"><span class="tio-k">←</span><span class="tio-v">${s.in}</span></div>
      <div class="tio"><span class="tio-k">→</span><span class="tio-v"><em>${s.out}</em></span></div>
      ${raw}
    </div>
  </div>`;
}

function traceSummary(label, steps){
  const clsCounts = {};
  steps.forEach(s=>clsCounts[s.cls]=(clsCounts[s.cls]||0)+1);
  const dots = Object.keys(clsCounts).map(c=>`<i class="tc-${c}"></i>`).join('');
  return `
  <div class="tracesum" onclick="toggleTrace(this)">
    <svg class="chev"><use href="#i-chevron-r"/></svg>
    <span>${label}</span>
    <span class="dots">${dots}</span>
  </div>
  <div class="traceblock">
    ${steps.map(s=>tstep(s)).join('')}
  </div>`;
}

function whyPanel(items){
  const rows = items.map(p=>`
    <div class="prov">
      <div class="m tc-${p.cls}"><svg><use href="#${TCLASS_ICON[p.cls]}"/></svg></div>
      <div class="tx"><b>${p.h}</b> ${p.t}<span class="src">${p.src}</span></div>
    </div>`).join('');
  return `
  <button class="whytrig" onclick="toggleWhy(this)"><svg><use href="#i-chevron-r"/></svg><span>Why?</span></button>
  <div class="whybody">${rows}</div>`;
}

/* ---------- global toggles (event delegation via inline onclick) ---------- */
window.toggleTrace = el => { el.classList.toggle('open'); el.nextElementSibling.classList.toggle('open'); };
window.toggleWhy   = el => { el.classList.toggle('open'); el.nextElementSibling.classList.toggle('open'); };

function screenScenario(){
  const base = computeFinancials(0.49);
  const scen = computeFinancials(0.49, { urea_mult:0.70, labour_mult:0.65, irrig_mult:0.73, landprep_mult:0.65, pest_mult:0.50, gypsum_mult:0, yield_mult:0.755 });
  return `
  <div class="stage-inner">
    <div class="stage-caption">
      <div class="eyebrow">Screen 11 · Scenario simulation</div>
      <h1>"What if my budget drops 40%?"</h1>
      <p>Same pure function, re-run under a constraint, diffed against the live plan — never a fresh essay. Reuses the exact engine from the Money tab via a nullable <code>scenario_run_id</code>.</p>
    </div>
    <div class="worksplit" style="grid-template-columns:1fr 380px">
      <div class="chatpanel">
        <div class="chat-scroll">
          <div class="msg user"><div class="who">Farmer</div><div class="bubble">What if my budget drops 40%?</div></div>
          ${!state.scenarioRun ? `<button class="btn btn-primary" onclick="runScenario()">Run the scenario</button>` : `
          ${traceSummary('Worked for 0.3s · 3 tool calls', [
            {cls:'field', name:'get_field_state', ms:10, status:'ok', in:'field_id', out:'base plan #1 loaded', src:'plans table'},
            {cls:'deterministic', name:'simulate_scenario', ms:9, status:'ok', in:'{budget_bdt: 45000 → 27000}', out:'diff on 6 line items', src:'financial_overrides, scenario_run_id set'},
            {cls:'retrieval', name:'search_knowledge_base', ms:171, status:'ok', in:'"reduced nitrogen Boro yield response"', out:'2 chunks · sim 0.77', src:'BARC FRG-2018 p.19'},
          ])}
          <div class="msg bot"><div class="who">AgriSense</div><div class="bubble">
            <p>Re-ran the plan against ৳27,000. I protected basal phosphorus and potassium and cut the weakest-return inputs first.</p>
          </div></div>`}
        </div>
      </div>
      <div class="rightpane">
        ${state.scenarioRun ? `
        <div class="card">
          <div class="card-head"><span class="t-label">Base → constrained</span></div>
          <div class="card-body">
            <table class="diff">
              <thead><tr><th>Line</th><th>Was</th><th>Now</th></tr></thead>
              <tbody>
                <tr><td>Urea</td><td class="was num">${tk(2916)}</td><td class="now down num">${tk(2038)}</td></tr>
                <tr><td>Labour</td><td class="was num">${tk(13475)}</td><td class="now down num">${tk(8759)}</td></tr>
                <tr><td>Irrigation</td><td class="was num">${tk(9800)}</td><td class="now down num">${tk(7154)}</td></tr>
                <tr><td>Land prep</td><td class="was num">${tk(5390)}</td><td class="now down num">${tk(3504)}</td></tr>
                <tr><td>Pest mgmt</td><td class="was num">${tk(2400)}</td><td class="now down num">${tk(1200)}</td></tr>
                <tr><td>Gypsum</td><td class="was num">${tk(441)}</td><td class="now down num">dropped</td></tr>
                <tr><td><b>Total cost</b></td><td class="was num">${tk(base.cost)}</td><td class="now down num">${tk(scen.cost)}</td></tr>
                <tr><td>Yield</td><td class="was num">${base.yieldT} t</td><td class="now down num">${scen.yieldT} t</td></tr>
                <tr><td><b>Net profit</b></td><td class="was num">${tk(base.net)}</td><td class="now down num">${tk(scen.net)}</td></tr>
                <tr><td><b>ROI</b></td><td class="was num">${base.roi}%</td><td class="now up num">${scen.roi}%</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="alert info">
          <svg class="ic" style="color:var(--trace-deterministic)"><use href="#i-cpu"/></svg>
          <div><h4>Less money, barely less profit — more risk</h4><p>You lose ${tk(base.net-scen.net)}, about 8%, while ROI climbs because every taka works harder. Break-even margin narrows though — worth it if cash is tight, not if land is the constraint.</p></div>
        </div>
        <button class="btn btn-ghost btn-block" onclick="resetScenario()">↺ Reset</button>
        ` : `<div class="card"><div class="card-body"><div class="t-support">Run the scenario to see the diff.</div></div></div>`}

}

/* ============================================================
   Screen registry + router
   ============================================================ */
const SCREENS = {
  login:      { label:'01 Login', fn:screenLogin, rail:false },
  farm:       { label:'02 Farm', fn:screenFarm, rail:'farm' },
  onboarding: { label:'03 Intake', fn:screenOnboarding, rail:'new' },
  planning:   { label:'04 Planning', fn:screenPlanning, rail:'north' },
  overview:   { label:'05 Overview', fn:screenOverview, rail:'north' },
  plan:       { label:'06 Plan', fn:screenPlan, rail:'north' },
  money:      { label:'07 Money', fn:screenMoney, rail:'north' },
  trace:      { label:'08 Trace', fn:screenTrace, rail:'north' },
  replan:     { label:'09 Replan', fn:screenReplan, rail:'north' },
  checkout:   { label:'10 Checkout', fn:screenCheckout, rail:'north' },
  scenario:   { label:'11 Scenario', fn:screenScenario, rail:'north' },
  purchases:  { label:'12 Purchases', fn:screenPurchases, rail:'purchases' },
  settings:   { label:'13 Settings', fn:screenSettings, rail:'settings' },
  tokens:     { label:'14 Tokens', fn:screenTokens, rail:false },
};
const ORDER = Object.keys(SCREENS);

window.go = (s) => { state.screen = s; render(); window.scrollTo(0,0); };

function renderMetaNav(){
  document.getElementById('metanav').innerHTML =
    '<span class="metanav-hint">mock nav</span>' +
    ORDER.map(k=>`<button class="mpill" ${k===state.screen?'aria-current="true"':''} onclick="go('${k}')">${SCREENS[k].label}</button>`).join('');
}

function renderRail(){
  const fieldsHTML = `
    <button class="rail-item" data-nav="farm" ${SCREENS[state.screen].rail==='farm'?'aria-current="true"':''} onclick="go('farm')">
      <svg><use href="#i-layers"/></svg><span class="lbl">Fields</span>
    </button>
    <button class="rail-item" ${SCREENS[state.screen].rail==='north'?'aria-current="true"':''} onclick="go('overview')">
      <svg><use href="#i-sprout"/></svg><span class="lbl">North Field</span><span class="stage-dot"></span>
    </button>
    <button class="rail-item" style="opacity:.7">
      <svg><use href="#i-sprout"/></svg><span class="lbl">South Field</span><span class="stage-dot done"></span>
    </button>
    <button class="rail-item" ${SCREENS[state.screen].rail==='new'?'aria-current="true"':''} onclick="go('onboarding')">
      <svg><use href="#i-plus"/></svg><span class="lbl">New field</span>
    </button>`;
  document.getElementById('railFields').innerHTML = fieldsHTML;

  document.querySelectorAll('.rail-item[data-nav]').forEach(b=>{
    b.onclick = () => go(b.dataset.nav);
  });
  document.querySelector('.rail-item[data-nav="purchases"]').setAttribute('aria-current', state.screen==='purchases');
  document.querySelector('.rail-item[data-nav="settings"]').setAttribute('aria-current', state.screen==='settings');

  document.getElementById('rail').style.display = SCREENS[state.screen].rail===false ? 'none' : 'flex';
}

function applyLang(){
  document.querySelectorAll('[data-en]').forEach(el=>{
    const v = state.lang==='bn' ? el.dataset.bn : el.dataset.en;
    if (v){ el.textContent = v; el.classList.toggle('bn', state.lang==='bn'); }
  });
}

function render(){
  document.getElementById('stage').innerHTML = SCREENS[state.screen].fn();
  renderMetaNav();
  renderRail();
  applyLang();
}

/* ---------- chrome interactivity ---------- */
document.getElementById('pinBtn').addEventListener('click', () => {
  state.pinned = !state.pinned;
  document.getElementById('pinBtn').setAttribute('aria-pressed', state.pinned);
  document.getElementById('rail').classList.toggle('pinned', state.pinned);
});
document.getElementById('langBtn').addEventListener('click', () => {
  state.lang = state.lang==='en' ? 'bn' : 'en';
  document.getElementById('langBtn').querySelector('span').textContent = state.lang==='en'?'EN':'বাং';
  applyLang();
});
document.getElementById('themeBtn').addEventListener('click', (e) => {
  state.theme = state.theme==='light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  const btn = document.getElementById('themeBtn');
  btn.querySelector('svg use').setAttribute('href', state.theme==='light' ? '#i-sun' : '#i-moon');
  btn.querySelector('span').textContent = state.theme==='light' ? 'Light' : 'Dark';
});

document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  const i = ORDER.indexOf(state.screen);
  if (e.key==='ArrowRight' && i<ORDER.length-1) go(ORDER[i+1]);
  if (e.key==='ArrowLeft' && i>0) go(ORDER[i-1]);
});

render();

</script>
